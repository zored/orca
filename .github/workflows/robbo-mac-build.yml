name: Robbo release builds

on:
  push:
    tags: ['v*-robbo.*']
  workflow_dispatch:

permissions:
  contents: read

env:
  ORCA_BACKGROUND_LAUNCH: '1'
  CSC_NAME: '-'
  CSC_IDENTITY_AUTO_DISCOVERY: 'false'

jobs:
  build:
    if: github.repository == 'zored/orca'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile
      - uses: ./.github/actions/install-mobile-dependencies

      - name: Build desktop and native helpers
        run: |
          pnpm run build:desktop:assets
          pnpm run build:computer-macos
          pnpm run build:keyboard-layout-macos --single-arch
          pnpm run build:process-footprint-macos --single-arch
          pnpm run build:notification-status-macos --single-arch
          pnpm run ensure:electron-runtime
          node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON config/scripts/orcad-distribution/prebuilds/pinned-node-downloads.mjs darwin-arm64

      - name: Package arm64 without Developer ID or notarization
        run: |
          version="$(node -p 'require("./package.json").version')-robbo.dev.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version="${GITHUB_REF_NAME#v}"
          fi
          test "$(node -p 'require("semver").valid(process.argv[1])' "$version")" = "$version"
          ORCA_LOCAL_BUILD_VERSION="$version" pnpm exec electron-builder \
            --config config/robbo-mac-builder.config.cjs --mac dmg zip --arm64 --publish never
          test -s dist/orca-macos-arm64.dmg
          test -s dist/orca-macos-arm64.zip
          app=dist/mac-arm64/Orca.app
          codesign --verify --deep --strict "$app"
          test "$(plutil -extract CFBundleIdentifier raw -o - "$app/Contents/Info.plist")" = dev.robbo.orca
          node -e 'const { extractFile } = require("@electron/asar"); const p = JSON.parse(extractFile(process.argv[1], "package.json")); if (p.version !== process.argv[2]) process.exit(1)' "$app/Contents/Resources/app.asar" "$version"
          test -z "$(find dist -name app-update.yml -print -quit)"

      - uses: actions/upload-artifact@v7
        with:
          name: robbo-macos-arm64
          path: |
            dist/orca-macos-arm64.dmg
            dist/orca-macos-arm64.zip
          if-no-files-found: error

  server:
    if: github.repository == 'zored/orca'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version-file: package.json
          package-manager-cache: false
      - uses: ./.github/actions/setup-pnpm
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: ./.github/actions/build-mobile-web-bundle
      - name: Build and pack the x64 server
        run: |
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          pnpm build:orcad-template --targets linux-x64-glibc
          SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)" node config/scripts/orcad-distribution/server-artifact/pack-orcad-server-artifact.mjs \
            --template out/orcad-template --target linux-x64-glibc --out-dir out/orca-server
          git rev-parse HEAD > out/orca-server/orca-server-linux-x64.commit
      - name: Start and pair on Ubuntu 22.04 without system Node
        run: |
          docker run --rm --init \
            -v "$PWD/out/orca-server:/artifacts:ro" \
            -v "$PWD/config/scripts/orcad-distribution/server-artifact:/smoke:ro" \
            ubuntu:22.04 sh -ec '
              mkdir /tmp/runtime
              tar -xzf /artifacts/orca-server-linux-x64.tar.gz -C /tmp/runtime --strip-components=1
              /tmp/runtime/runtimes/node-*/bin/node /smoke/smoke-orcad-server-artifact.mjs --archive /artifacts/orca-server-linux-x64.tar.gz
            '
      - uses: actions/upload-artifact@v7
        with:
          name: robbo-server-linux-x64
          path: |
            out/orca-server/orca-server-linux-x64.tar.gz
            out/orca-server/orca-server-linux-x64.tar.gz.sha256
            out/orca-server/orca-server-linux-x64.commit
          if-no-files-found: error

  release:
    if: github.repository == 'zored/orca' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: [build, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: robbo-macos-arm64
      - uses: actions/download-artifact@v8
        with:
          name: robbo-server-linux-x64
      - name: Publish the tagged release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" orca-macos-arm64.dmg orca-macos-arm64.zip \
            orca-server-linux-x64.tar.gz orca-server-linux-x64.tar.gz.sha256 orca-server-linux-x64.commit \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "Orca for Apple silicon (ad-hoc signed, not notarized) and a headless Linux x64 server with bundled Node. Update by installing a newer fork release."
